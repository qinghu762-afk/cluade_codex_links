name: Publish 1.0.1 once

on:
  push:
    branches: [main]
    paths: [release.json]

permissions:
  contents: read

concurrency:
  group: publish-1.0.1-once
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.run_number == 1 && github.repository == 'qinghu762-afk/cluade_codex_links' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish only the approved 1.0.1 release and exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'AGENT_LINK_RELEASE_SCRIPT'
          import { createHash } from 'node:crypto';
          
          const repo = process.env.REPOSITORY;
          const sha = process.env.TARGET_SHA;
          const token = process.env.GH_TOKEN;
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo || '') || !/^[a-f0-9]{40}$/.test(sha || '') || !token) throw new Error('Missing repository, exact commit or workflow token');
          const api = `https://api.github.com/repos/${repo}`;
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          async function request(url, method = 'GET', body, contentType = 'application/json') {
            const r = await fetch(url, { method, headers: { ...headers, 'Content-Type': contentType }, ...(body === undefined ? {} : { body: Buffer.isBuffer(body) ? body : JSON.stringify(body) }) });
            if (!r.ok) throw Object.assign(new Error(`GitHub API ${method} failed: HTTP ${r.status}`), { status: r.status });
            return r.json();
          }
          async function content(path) {
            const item = await request(`${api}/contents/${path}?ref=${sha}`);
            if (item.encoding !== 'base64') throw new Error('Unexpected contents encoding');
            return Buffer.from(item.content, 'base64');
          }
          const spec = JSON.parse((await content('release.json')).toString('utf8'));
          if (spec.version !== '1.0.1' || spec.assets.length !== 3) throw new Error('Invalid release specification');
          const lockedAssets = [{"path":"downloads/claude-agent-link.zip","sha256":"f6f798de11bbc560bb6c17fdf834a9ec203d3ba80f1fd01d9c20ef907a85eee6"},{"path":"downloads/codex-agent-link.zip","sha256":"0aff3ef9b47ded3c5e8457eafa5e86b89ef239689b2273c98cff5934d507d248"},{"path":"downloads/claude-codex-agent-link.zip","sha256":"bc4b061ddc1fba7c65b2442211858ab908338a9ac1ce6a8e047d9c56f4b5cecf"}];
          if (JSON.stringify(spec.assets) !== JSON.stringify(lockedAssets)) throw new Error('Only the three approved 1.0.1 assets may be published');
          for (const host of ['claude', 'codex']) {
            const metadata = JSON.parse((await content(`${host}-agent-link/package-manifest.json`)).toString('utf8'));
            if (metadata.version !== spec.version) throw new Error('Package version does not match Release');
          }
          const assets = [];
          for (const asset of spec.assets) {
            if (!/^downloads\/(claude-agent-link|codex-agent-link|claude-codex-agent-link)\.zip$/.test(asset.path)) throw new Error('Unexpected asset path');
            const bytes = await content(asset.path);
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (digest !== asset.sha256) throw new Error('Release asset checksum mismatch');
            assets.push({ name: asset.path.split('/').at(-1), bytes, digest: `sha256:${digest}` });
          }
          let release;
          try { release = await request(`${api}/releases/tags/${spec.version}`); }
          catch (error) { if (error.status !== 404) throw error; }
          if (release && (!release.draft || release.target_commitish !== sha)) throw new Error('Release already exists; refusing to replace a published or unrelated release');
          if (!release) release = await request(`${api}/releases`, 'POST', { tag_name: spec.version, target_commitish: sha, name: spec.version, body: spec.body, draft: true, prerelease: false });
          for (const asset of assets) {
            const existing = release.assets.find(a => a.name === asset.name);
            if (existing) { if (existing.digest !== asset.digest) throw new Error('Existing draft asset differs'); continue; }
            const uploaded = await request(`https://uploads.github.com/repos/${repo}/releases/${release.id}/assets?name=${encodeURIComponent(asset.name)}`, 'POST', asset.bytes, 'application/zip');
            if (uploaded.state !== 'uploaded' || uploaded.size !== asset.bytes.length || uploaded.digest !== asset.digest) throw new Error('Uploaded asset verification failed');
          }
          const published = await request(`${api}/releases/${release.id}`, 'PATCH', { draft: false, prerelease: false, make_latest: 'true' });
          if (published.draft || !published.published_at || published.assets.length !== 3) throw new Error('Release publication verification failed');
          console.log(JSON.stringify({ published: published.html_url, tag: published.tag_name, assets: published.assets.map(a => ({ name: a.name, digest: a.digest })) }, null, 2));
          
          AGENT_LINK_RELEASE_SCRIPT
